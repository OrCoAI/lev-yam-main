name: CI — lint, test, typecheck & build

# Catches platform breakage before it reaches main (which deploys straight to
# production): lint (oxlint) + unit tests (vitest, money math) run before the same
# tsc + vite build the deploy performs (work order G6.2–3, ADR 0020 / 0037).
# The VITE_* secrets are the anon/publishable values — safe to expose; the
# build also succeeds without them (lib/supabase.ts handles unconfigured env),
# so PRs from forks still get checked.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 2, as tier.yml: on a pull_request HEAD^1 is the PR base, which is all the video
          # change check below needs. No history beyond that.
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app-src/package-lock.json

      # H1 drift check: UI permission mirror (PERM) ↔ core.permissions seeds.
      # The DB stays the real guard either way; this catches the silent UI drift.
      # Sub-second and needs no npm install, so a drift failure doesn't burn a
      # full build to be discovered.
      - name: Permission mirror drift check
        run: node supabase/tests/check-permission-drift.mjs

      # The baseline migration (what local applies on `db reset`; staging and prod
      # are applied by hand, never pushed — ADR 0061) must stay in sync with
      # supabase/schema/*.sql — sub-second, no install.
      - name: Migration baseline drift check
        run: node supabase/tests/build-baseline.mjs

      # sitemap.xml and the /stories/ hubs are generated. The deploy regenerates
      # them anyway, so this can't break production — it fails the branch so a
      # stale committed copy (what local dev and code review read) gets noticed.
      - name: Stories sitemap/hub drift check
        run: node scripts/gen-stories-index.mjs --check

      # The /happening/ shells and landing templates carry the same generated
      # chrome (ADR 0049/0056); the stories check above does not cover them.
      - name: Happening chrome drift check
        run: node scripts/gen-happening.mjs --check

      - name: Install platform dependencies
        working-directory: app-src
        run: npm ci

      # The landing pages are rendered at deploy from the live feed, so a
      # template error would otherwise surface only in a deploy. Render the
      # committed fixture instead (no network; needs app-src's `qrcode`, hence
      # after npm ci).
      - name: Happening landing pages render (fixture)
        run: node scripts/gen-happening.mjs --fixture --out "$RUNNER_TEMP/happening-fixture"

      # Rails that let Tier C be trusted (G6). Lint gate: errors only — policy and
      # warning inventory in ADR 0037. Tests: POS bill math + finance helpers.
      - name: Lint platform
        working-directory: app-src
        run: npm run lint

      - name: Unit tests (money math)
        working-directory: app-src
        run: npm test

      - name: Typecheck + build platform
        working-directory: app-src
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # video/ (ADR 0064) is never deployed, but a broken Remotion project must fail the branch
      # here — in this required job, since a separate job would need a branch-protection edit
      # to count — not the next person's `npm run dev`. Lint + tsc only (a render would download
      # Chrome Headless Shell for no deploy), and only when video/ or this file changed: the
      # install is ~400 MB and nothing else can break the project. A pull_request compares
      # against the PR base (HEAD^1 of the merge commit); a push against the previous tip, and
      # when that commit is not in the shallow clone (a new branch, a multi-commit push) the
      # answer is "changed" — when in doubt, run.
      - name: Did video/ change?
        id: video
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1
          [ "$EVENT" = push ] && base="$BEFORE"
          if git cat-file -e "$base^{commit}" 2>/dev/null && git diff --quiet "$base" HEAD -- video/ .github/workflows/ci.yml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"; echo 'video/ unchanged — install and lint skipped.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install video dependencies
        if: steps.video.outputs.changed == 'true'
        working-directory: video
        run: npm ci

      - name: Lint + typecheck video
        if: steps.video.outputs.changed == 'true'
        working-directory: video
        run: npm run lint
