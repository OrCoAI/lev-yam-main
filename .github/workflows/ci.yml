name: CI — typecheck & build

# Catches platform breakage before it reaches main (which deploys straight to
# production). Runs the same gate as the deploy build: tsc + vite build.
# The VITE_* secrets are the anon/publishable values — safe to expose; the
# build also succeeds without them (lib/supabase.ts handles unconfigured env),
# so PRs from forks still get checked.

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the tier check when the description is fixed (the only remedy the
    # check asks for); default types would leave a corrected declaration unchecked.
    types: [opened, synchronize, reopened, edited]
  push:
    branches-ignore: [main]

jobs:
  # G1 risk tiers (ADR 0015): every PR declares "**Tier:** A|B|C"; the declared tier must be
  # at least what the changed paths require (scripts/check-tier.mjs is the single rule set).
  # Its own job, and its own required check in branch protection: a `push` run of `build`
  # (which has no PR body to read) can never satisfy it. fetch-depth 2 gives the merge
  # commit's first parent = the PR base; no extra fetch, no history. Untrusted PR input
  # (body, actor) reaches the shell only through env vars, never interpolated.
  tier:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Risk-tier declaration check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-tier.mjs --base HEAD^1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-src/package-lock.json

      # H1 drift check: UI permission mirror (PERM) ↔ core.permissions seeds.
      # The DB stays the real guard either way; this catches the silent UI drift.
      # Sub-second and needs no npm install, so a drift failure doesn't burn a
      # full build to be discovered.
      - name: Permission mirror drift check
        run: node supabase/tests/check-permission-drift.mjs

      # The baseline migration (what local/staging apply on `db reset`/`db push`)
      # must stay in sync with supabase/schema/*.sql — sub-second, no install.
      - name: Migration baseline drift check
        run: node supabase/tests/build-baseline.mjs

      # sitemap.xml and the /stories/ hubs are generated. The deploy regenerates
      # them anyway, so this can't break production — it fails the branch so a
      # stale committed copy (what local dev and code review read) gets noticed.
      - name: Stories sitemap/hub drift check
        run: node scripts/gen-stories-index.mjs --check

      - name: Typecheck + build platform
        working-directory: app-src
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build
