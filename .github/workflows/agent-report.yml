name: agent report

# Shared worker for the three recurring report jobs (weekly / monthly /
# quarterly-prep, work order G4.2–4). They differ only in schedule, prompt and
# tool scope, so everything else lives here once and they call it.
# Not callable on its own: `workflow_call` only.
#
# ── WHY THIS JOB IS LOCKED DOWN THE WAY IT IS ────────────────────────────────
# These reports read GitHub issues and PR bodies. This is a PUBLIC repo, so any
# member of the public can put text in front of this agent by opening an issue —
# with no write access and no actor check, because schedule/workflow_dispatch
# events have no triggering actor to check. Treat every word it reads as hostile.
#
# `--allowedTools` is NOT a restriction — the CLI reference is explicit: "Tools
# that execute without prompting for permission … To restrict which tools are
# available, use --tools instead." It is UNIONED with whatever the settings
# files allow. So the boundary here is four things, none of which is the prompt:
#
#   --restricted            ignores user/project/local settings files, so the
#                           repo's own .claude/settings.json — written for local
#                           dev, with `defaultMode: acceptEdits` and
#                           `Bash(node *)` / `Bash(python3 *)` in its allow list —
#                           does NOT apply here. Passing that file into CI would
#                           hand an issue-reading agent arbitrary code execution
#                           next to ANTHROPIC_API_KEY. It is deliberately not
#                           passed as `settings:`, and --restricted is what stops
#                           the checkout's copy applying as project settings.
#   --tools                 the available set, nothing else exists: no Edit, no
#                           Write, no WebFetch.
#   --permission-prompts none   "anything that would prompt is denied
#                           automatically" — this is what turns the --allowedTools
#                           list into an effective allowlist in headless CI.
#   --disallowedTools       deny beats allow; the code-execution and egress
#                           shells are named explicitly as a second layer.
#
# `permissions: contents: read` is the last line: a push fails at the token layer
# whatever happens above. What is NOT protected is the runner and its network —
# hence the layers above, not instead of them.

on:
  workflow_call:
    inputs:
      prompt:
        description: Instructions for the run.
        required: true
        type: string
      allowed_tools:
        description: >
          --allowedTools value. Read-only commands plus `gh issue create` (the report's
          one write). MUST be a literal in the caller, never a value derived from event
          data — it is interpolated into the CLI argument line.
        required: true
        type: string
      max_turns:
        # string, not number: Actions renders a `number` input in decimal form, and
        # `--max-turns 40.0` is not a valid turn count.
        required: false
        type: string
        default: '40'
    secrets:
      anthropic_api_key:
        required: false

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: every one of these reports reads merge history over a
      # period, which a shallow clone does not contain.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Until the owner adds the secret, exit clean with a note rather than
      # failing on every schedule — a workflow that cries wolf nightly gets
      # muted, and then a real failure goes unseen too.
      - name: Check the API key is configured
        id: key
        env:
          KEY: ${{ secrets.anthropic_api_key }}
        run: |
          if [ -z "$KEY" ]; then
            echo 'ANTHROPIC_API_KEY is not set — add it under Settings → Secrets and variables → Actions. Skipping.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          prompt: ${{ inputs.prompt }}
          # Every value that contains a space MUST stay quoted: claude_args is
          # shell-tokenized per line, so a bare Bash(git log *) splits into
          # "Bash(git", "log", "*)" and the whole rule silently stops matching
          # (anthropics/claude-code-action#844).
          claude_args: |
            --model claude-sonnet-5
            --max-turns ${{ inputs.max_turns }}
            --restricted
            --permission-prompts none
            --tools "Read,Glob,Grep,Bash"
            --allowedTools "${{ inputs.allowed_tools }}"
            --disallowedTools "Bash(node *),Bash(npx *),Bash(npm *),Bash(python3 *),Bash(python *),Bash(deno *),Bash(curl *),Bash(wget *),Bash(nc *),Bash(ssh *),Bash(eval *),Bash(git push *),Bash(gh api *),Bash(gh pr merge *),Bash(gh secret *),Bash(gh workflow *),Bash(supabase *),Bash(dtctl *),Bash(bluebox *),Edit,Write,NotebookEdit,WebFetch,WebSearch"
        env:
          # issues:write + contents:read only — the narrowest token that can still
          # open the report issue.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
