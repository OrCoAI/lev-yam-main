name: agent report

# Shared worker for the three recurring report jobs (weekly / monthly /
# quarterly-prep, work order G4.2–4). They differ only in schedule, prompt and
# tool scope, so everything else lives here once and they call it.
# Not callable on its own: `workflow_call` only.
#
# ── WHY THIS JOB IS LOCKED DOWN THE WAY IT IS ────────────────────────────────
# These reports read GitHub issues and PR bodies. This is a PUBLIC repo, so any
# member of the public can put text in front of this agent by opening an issue —
# with no write access and no actor check, because schedule/workflow_dispatch
# events have no triggering actor to check. Treat every word it reads as hostile.
#
# `--allowedTools` is NOT a restriction — the CLI reference is explicit: "Tools
# that execute without prompting for permission … To restrict which tools are
# available, use --tools instead." It is UNIONED with whatever the settings files
# allow. The repo's own `.claude/settings.json` is written for LOCAL DEV:
# `defaultMode: acceptEdits`, `Bash(node *)`, `Bash(python3 *)`. Inheriting it
# here would hand an issue-reading agent arbitrary code execution next to
# the Claude credential (CLAUDE_CODE_OAUTH_TOKEN).
#
# The CLI has flags for exactly this (--restricted / --tools /
# --permission-prompts) and they do NOT work here: this action runs the
# @anthropic-ai/claude-agent-sdk, not the CLI binary, and it accepts only
# --mcp-config, --allowedTools, --disallowedTools, --max-turns, --model and
# --append-system-prompt. Passing the others made every run die in ~120ms with
# `is_error: true`, no model call and no error text. Found by Step 6's acceptance
# run; do not reintroduce them.
#
# So the boundary is three things that do not depend on flag semantics:
#
#   1. The workspace copy of `.claude/settings.json` is DELETED below, before the
#      action runs. No project settings means nothing widens the permission set.
#      `settings:` is deliberately not passed either.
#   2. --disallowedTools — a real deny list, and deny beats allow. The
#      code-execution and egress shells are named explicitly.
#   3. `permissions: contents: read` — a push fails at the token layer whatever
#      happens above, and `github_token` below pins API calls to that same
#      scoped token.
#
# What is still NOT protected is the runner and its network. These jobs read public
# issue text, so treat every word of it as hostile.
#
# THE AGENT CAN READ ITS OWN ENVIRONMENT, and no deny list changes that: the shell
# expands `$VAR` inside the arguments of any ALLOWED command, `gh`'s own `--jq` is gojq
# and implements `$ENV`, and `head`/`tail`/`cut`/`sort` read `/proc/self/environ` as
# happily as the denied `cat` does. `env`, `printenv`, `/proc`, `jq`, `awk` and `find`
# are denied to remove the obvious paths, not because that closes the class.
#
# So the design assumes the agent may learn a secret, and takes away every way to send
# one (ADR 0048):
#   - it cannot publish: `gh issue create/comment/edit/close/reopen/…` are denied, and
#     it writes `report.md` for a later step to publish instead;
#   - it can write files, but not the ones that matter: `.git/` is denied because git runs
#     `diff.external`/`textconv` THROUGH THE SHELL on an allowed `git log -p` / `git show`,
#     which would be arbitrary execution; `.github/`, `.claude/`, `scripts/` and `supabase/`
#     are denied so it cannot rewrite the harness or the vetting script.
#     TWO forms were tried here and BOTH silently produced no report at all, each costing a
#     ~8-minute run: `Write(report.md)` as the allow (runs 35732989022 and 35762372931 — the
#     action's SDK translation does not appear to honour a path specifier on Write), and
#     `Write(/**)` as an extra deny, which matches the RESOLVED path of `report.md` and, since
#     deny beats allow, forbids the one file the agent exists to produce. Do not reintroduce
#     either. The write is therefore a plain `Write` grant, and the containment is: nothing
#     the agent writes is published except through the vetting step below;
#   - it cannot reach the runner's own file commands: `GITHUB_STEP_SUMMARY` (rendered
#     publicly), `GITHUB_ENV`, `GITHUB_PATH` and `GITHUB_OUTPUT` are pointed at /dev/null
#     for the agent step. An allowed command plus a shell redirect would otherwise write
#     them, so scoping `Write` alone is not enough. The action's own job summary is the
#     deliberate price; the run log still has it.
#   - `report-guard.py` then refuses to publish a report containing a secret's value.
#     A detector, not a boundary: an encoded value passes it.
# `permissions: contents: read` and the prompt's hard rule are the other two layers.

on:
  workflow_call:
    inputs:
      prompt:
        description: Instructions for the run.
        required: true
        type: string
      allowed_tools:
        description: >
          --allowedTools value. Read-only commands plus `Write(report.md)` — the agent's
          only write, and not a network one (ADR 0048). MUST be a literal in the caller,
          never a value derived from event data — it is interpolated into the CLI
          argument line.
        required: true
        type: string
      # A RUNAWAY GUARD, not a budget. The action fails the job when Claude finishes
      # successfully past this number, so a cap set near the real turn count turns a
      # good report into a red X. Observed on the first live runs: weekly 73, monthly 50,
      # quarterly 34. 120 leaves headroom; cost is bounded by the work (~$1/run), not by
      # this number.
      max_turns:
        # string, not number: Actions renders a `number` input in decimal form, and
        # `--max-turns 40.0` is not a valid turn count.
        required: false
        type: string
        default: '40'
      # The label the publish step applies. Must already exist in the repo — these jobs
      # deliberately cannot create labels.
      label:
        required: true
        type: string
    secrets:
      # A Claude subscription token from `claude setup-token`, not an API key (ADR 0042).
      claude_code_oauth_token:
        required: false
      # A Google service-account JSON key, Viewer on the GA4 + Search Console properties
      # only (ADR 0047). Rotated at the 2027-01-01 review.
      google_sa_key:
        required: false

permissions:
  contents: read
  issues: write
  # The action mints its token through GitHub's OIDC endpoint and fails without
  # this ("Could not fetch an OIDC token"). It is NOT a repo-write grant: it only
  # lets the job request an identity token. The `github_token` input below is
  # what the action actually uses for GitHub API calls, so the job's own scoped
  # token — contents:read + issues:write — stays the ceiling.
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: every one of these reports reads merge history over a
      # period, which a shallow clone does not contain.
      # Pinned to commit SHAs, not tags: these two run upstream of `GOOGLE_SA_KEY`
      # (checkout supplies the very script that receives it), and a tag can be moved.
      # Dependabot's github-actions ecosystem keeps the SHAs current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Until the owner adds the secret, exit clean with a note rather than
      # failing on every schedule — a workflow that cries wolf nightly gets
      # muted, and then a real failure goes unseen too.
      # The repo's .claude/settings.json is a local-dev policy: acceptEdits plus
      # Bash(node *) / Bash(python3 *). It must not apply to a job that reads
      # public issue text. This is a throwaway checkout, so deleting it is the
      # simplest thing that cannot be defeated by a flag being misspelled or
      # unsupported.
      - name: Drop the local-dev permission policy from the workspace
        run: rm -f .claude/settings.json

      - name: Check the API key is configured
        id: key
        env:
          KEY: ${{ secrets.claude_code_oauth_token }}
        run: |
          if [ -z "$KEY" ]; then
            echo 'CLAUDE_CODE_OAUTH_TOKEN is not set — run `claude setup-token` locally and store the result under Settings → Secrets and variables → Actions. Skipping.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      # GA4 + Search Console snapshot (ADR 0047) — the ONLY step that names
      # `google_sa_key`: GitHub exposes a secret to the steps that reference it, so the
      # agent below never has it in its environment and just Reads the file. Read-only
      # against Google; exits 0 on every error with the reason in the file, so a Google
      # hiccup costs a `n/a` line, not the report. `node` is the runner's (>= 18 is
      # enough), not the agent's — Bash(node *) stays denied below.
      # `shell: bash` for pipefail — without it the pipe hides a non-zero exit and a
      # script that crashed outright would look like a clean run with no numbers.
      # continue-on-error keeps that visible (a red step) without costing the report.
      - name: Analytics snapshot (GA4 + Search Console)
        if: steps.key.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_SA_KEY: ${{ secrets.google_sa_key }}
        run: node scripts/analytics-snapshot.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - if: steps.key.outputs.ready == 'true'
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ inputs.prompt }}
          # Every value that contains a space MUST stay quoted: claude_args is
          # shell-tokenized per line, so a bare Bash(git log *) splits into
          # "Bash(git", "log", "*)" and the whole rule silently stops matching
          # (anthropics/claude-code-action#844).
          claude_args: |
            --model claude-sonnet-5
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ inputs.allowed_tools }}"
            --disallowedTools "Read(/proc/**),Read(/etc/**),Read(~/.claude/**),Bash(env),Bash(env *),Bash(printenv),Bash(printenv *),Bash(cat /proc/*),Bash(grep * /proc/*),Bash(set),Bash(export),Bash(node *),Bash(npx *),Bash(npm *),Bash(python3 *),Bash(python *),Bash(deno *),Bash(curl *),Bash(wget *),Bash(nc *),Bash(ssh *),Bash(eval *),Bash(git push *),Bash(gh api *),Bash(gh pr merge *),Bash(gh secret *),Bash(gh workflow *),Bash(supabase *),Bash(dtctl *),Bash(bluebox *),Bash(jq *),Bash(awk *),Bash(find *),Bash(gh issue create *),Bash(gh issue comment *),Bash(gh issue edit *),Bash(gh issue close *),Bash(gh issue reopen *),Bash(gh issue delete *),Bash(gh issue lock *),Bash(gh issue unlock *),Bash(gh issue pin *),Bash(gh issue unpin *),Bash(gh issue transfer *),Bash(gh issue develop *),Bash(gh pr comment *),Bash(gh pr close *),Bash(gh pr reopen *),Bash(gh pr review *),Bash(gh pr edit *),Bash(gh pr merge *),Bash(gh gist *),Bash(gh release *),Bash(gh label *),Bash(gh alias *),Bash(gh config *),Bash(gh repo *),Bash(gh auth *),Edit,NotebookEdit,WebFetch,WebSearch,Write(.github/**),Write(.claude/**),Write(scripts/**),Write(supabase/**),Write(.git/**)"
        env:
          # The agent no longer opens issues; it still reads them to build the report.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The runner's file commands are a write surface reachable by any allowed
          # command with a shell redirect — GITHUB_STEP_SUMMARY renders on a PUBLIC run
          # page, GITHUB_ENV and GITHUB_PATH feed the step that holds the tokens.
          GITHUB_STEP_SUMMARY: /dev/null
          GITHUB_ENV: /dev/null
          GITHUB_PATH: /dev/null
          GITHUB_OUTPUT: /dev/null
          BASH_ENV: ''

      # The agent writes `report.md`; THIS step publishes it. That split is the point
      # (roadmap item 14): the agent holds no network write at all, so text it was
      # talked into producing — by a public issue, or by attacker-influenced analytics
      # values — has nowhere to go but a file a fixed script inspects first.
      #
      # It is not a complete boundary. The agent can still read its own environment
      # (`$VAR` expands in any allowed command's arguments; `gh --jq` is gojq with
      # `$ENV`), so it could write a secret INTO the report. That is what the redaction
      # check below is for: if a secret's value appears in the report, nothing is
      # published and the run goes red. Encodings would defeat a literal match — this
      # raises the cost and makes the naive attempt loud, it does not eliminate it.
      - name: Publish the report
        if: steps.key.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ inputs.label }}
          # Read ONLY to be redacted. Both are values the agent could have reached.
          SCAN_OAUTH: ${{ secrets.claude_code_oauth_token }}
          SCAN_GH: ${{ secrets.GITHUB_TOKEN }}
          # Not in the agent's environment by design — watched anyway, since the agent
          # does read the analytics snapshot this key produced.
          SCAN_GOOGLE: ${{ secrets.google_sa_key }}
        run: |
          set -euo pipefail
          # The agent had a shell in this workspace. `Write(scripts/**)` is denied, but an
          # ALLOWED command with a redirect (`head -c 1 x > scripts/report-guard.py`) is
          # not a Write-tool call and never meets that rule — so restore the vetting
          # script from the commit before running it. Without this line the "deterministic"
          # step could be running agent-authored Python next to the scanned secrets.
          git checkout HEAD -- scripts/report-guard.py
          if [ ! -s report.md ]; then
            # Say what IS there: "no report" twice cost two 8-minute runs to diagnose.
            echo 'The agent produced no report.md — nothing to publish. Workspace root:'
            ls -la
            echo 'The agent produced no report.md — nothing to publish.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A secret in the report is treated as compromise, not as something to clean
          # up and ship: publishing a redacted version would hide that it happened.
          if ! python3 scripts/report-guard.py; then
            echo 'Report withheld — see the log. Nothing was published.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # report-guard wrote title.txt and body.md. The duplicate check compares titles
          # with `jq --arg`, so agent-authored text never becomes part of a search string
          # or a filter expression — it stays an argument.
          title=$(cat title.txt)
          # --limit 1000: the dedupe is an exact title match over this label's whole
          # history, and a weekly label passes 200 issues in under four years.
          gh issue list --state all --label "$LABEL" --limit 1000 --json number,title > issues.json
          existing=$(jq -r --arg t "$title" '[.[] | select(.title == $t) | .number] | first // empty' issues.json)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
            echo "Appended the report to existing issue #$existing ($title)." >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh issue create --title "$title" --body-file body.md --label "$LABEL")
            echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          fi
