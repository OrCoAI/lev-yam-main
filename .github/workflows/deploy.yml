name: Deploy site + platform to GitHub Pages

# Builds the Vite platform (/app) and bundles it with the static marketing site,
# then publishes everything to GitHub Pages (levyam.com).
#
# ONE-TIME SETUP in the repo: Settings → Pages → Source = "GitHub Actions",
# and add repo Secrets VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY (the publishable
# anon values — safe to expose; RLS is the guard).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-src/package-lock.json

      # H1 drift check on the deploy path too — direct pushes to main skip
      # ci.yml (its push trigger ignores main), and this is the push that
      # actually reaches production. Sub-second, no npm install needed.
      - name: Permission mirror drift check
        run: node supabase/tests/check-permission-drift.mjs

      - name: Build platform (/app)
        working-directory: app-src
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble site (static marketing + built /app)
        run: |
          mkdir -p _site
          # static marketing site + the site-root 404 handler (served from root, as today).
          # 404.html is what GitHub Pages serves for any unknown path; it routes /app/*
          # deep links into the SPA and sends other unknown paths to the marketing home.
          cp index.html survey-june.html pos.html robots.txt sitemap.xml CNAME 404.html _site/
          cp -r css js img fonts _site/
          # the built platform under /app
          mkdir -p _site/app
          cp -r app-src/dist/* _site/app/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Fail loudly if production doesn't actually serve the three live surfaces.
      # Retries cover CDN propagation right after the deploy completes.
      - name: Smoke-check production
        run: |
          for path in / /app/ /pos.html; do
            url="https://levyam.com${path}"
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "${code}  ${url}"
            if [ "$code" != "200" ]; then
              echo "::error::Smoke check failed: ${url} returned ${code}"
              exit 1
            fi
          done
