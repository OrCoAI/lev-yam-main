name: Deploy site + platform to GitHub Pages

# Builds the Vite platform (/app) and bundles it with the static marketing site,
# then publishes everything to GitHub Pages (levyam.com).
#
# ONE-TIME SETUP in the repo: Settings → Pages → Source = "GitHub Actions",
# and add repo Secrets VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY (the publishable
# anon values — safe to expose; RLS is the guard).

on:
  push:
    branches: [main]
  # The "What's happening" landing pages are generated from the platform feed
  # at build time (ADR 0056). Publishing an item dispatches this workflow
  # through the `rebuild-site` Edge Function (a fine-grained PAT, Actions
  # read/write on this repo only); the nightly run retires items whose date
  # passed without anyone publishing. 22:30 UTC = 00:30 / 01:30 Jerusalem.
  # Prod only — a schedule always runs from the default branch, so staging
  # (deploy-staging.yml) has none: it would overwrite the branch mid-verification.
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The dispatch token names a ref (it is a request parameter, not a token
    # property), so a dispatch on any other ref must no-op: production is
    # built from main and nothing else. `github.ref`, never
    # `event_name == 'push'` — the schedule and the rebuild dispatch both run
    # on main and must pass. The github-pages environment's main-only branch
    # policy is the backstop that does not depend on this file.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app-src/package-lock.json

      # H1 drift check on the deploy path too — direct pushes to main skip
      # ci.yml (its push trigger ignores main), and this is the push that
      # actually reaches production. Sub-second, no npm install needed.
      - name: Permission mirror drift check
        run: node supabase/tests/check-permission-drift.mjs

      # The baseline migration (local/staging `db reset`/`db push` artifact) must
      # stay in sync with supabase/schema/*.sql. Sub-second, no npm install.
      - name: Migration baseline drift check
        run: node supabase/tests/build-baseline.mjs

      # The only check that asks the LIVE database anything. The two above are
      # file-vs-file and cannot see the failure that actually happened twice:
      # prod is off the migration pipeline, so a `grant`/`revoke` added later
      # against an existing object never ran there. That is how `authenticated`
      # kept TRUNCATE on the POS tables (RLS does not govern TRUNCATE) and how
      # core.admin_assign_role stayed self-grantable until 2026-08-05.
      # Skips with a warning when the token is absent so a fork or a secretless
      # run still deploys; fails the deploy on real drift.
      - name: Prod grant drift audit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Single copy of the invocation, shared with deploy-staging.yml — same
        # reason assemble-site.sh is shared: the two tiers must not drift in
        # HOW they audit.
        run: bash scripts/audit-grants-ci.sh teyxtdccsrkdpqnbfcga

      # Same rails as ci.yml (lint ratchet + money-math tests, ADR 0037) so the artifact
      # that reaches production never skips them, whatever path a commit took to main.
      - name: Install, lint, test platform
        working-directory: app-src
        run: |
          npm ci
          npm run lint
          npm test

      - name: Build platform (/app)
        working-directory: app-src
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # The deploy allowlist lives in scripts/assemble-site.sh — the same script
      # staging runs via scripts/build-site.sh, so the two tiers cannot drift.
      # It also regenerates sitemap.xml + the /stories/ hubs, which is why no bot
      # ever commits them to main (every commit here must pass the review gate).
      # The assemble step now also reads the platform feed (scripts/gen-happening.mjs)
      # to render the /happening/ landing pages — the same anon values the /app build
      # bakes in; a feed failure fails the build (ADR 0056).
      - name: Assemble site (static marketing + built /app + /happening/ pages)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: bash scripts/assemble-site.sh prod

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Fail loudly if production doesn't actually serve the live surfaces.
      # Round-based retries: CDN propagation is one shared cause, so failures
      # share one sleep per round instead of each path burning its own sleeps
      # (9 paths × 3 × 10s serial worst-case would sit ~4.5 min before failing).
      - name: Smoke-check production
        run: |
          pending=(/ /app/ /pos.html /stories/ /stories/ar/ /happening/ /happening/ar/ /robots.txt /sitemap.xml /llms.txt /facts.txt)
          for round in 1 2 3; do
            failed=()
            for path in "${pending[@]}"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://levyam.com${path}")
              echo "${code}  https://levyam.com${path}  (round ${round})"
              [ "$code" = "200" ] || failed+=("$path")
            done
            [ "${#failed[@]}" -eq 0 ] && exit 0
            pending=("${failed[@]}")
            [ "$round" -lt 3 ] && sleep 10
          done
          echo "::error::Smoke check failed after 3 rounds: ${pending[*]}"
          exit 1
