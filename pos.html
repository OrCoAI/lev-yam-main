function buildItems() {
  const out = [];
  MENU.forEach((g,gi) =>
    g.items.forEach((it,ii) => {
      if (it.combo) return;   // combos are configured via the picker, not a qty stepper
      out.push({id:gi+"-"+ii, name:it.name, nameAr:it.nameAr, price:it.price, oh:g.oh, cat:g.cat, catAr:g.catAr, qty:0, sent:0, done:0, served:0});
    })
  );
  return out;
}

// Combo menu items, flattened with their category/pricing for the picker.
const COMBO_DEFS = [];
MENU.forEach(g => g.items.forEach(it => {
  if (it.combo) COMBO_DEFS.push({ name:it.name, nameAr:it.nameAr, price:it.price, oh:g.oh, cat:g.cat, catAr:g.catAr, combo:it.combo });
}));

// Merge a saved cart with the current MENU: refresh menu items (category/price/name —
// so renames don't orphan them) while preserving quantities, custom items and combo lines.
// Kitchen pipeline counts per line: qty (ordered) → sent → done → served.
// Migrate the old firedAt/doneAt booleans to counts so existing tables don't break.
function normalizeLine(it) {
  if (typeof it.sent === "number") return { ...it, done: it.done || 0, served: it.served || 0 };
  return { ...it, sent: it.firedAt ? (it.qty || 0) : 0, done: it.doneAt ? (it.qty || 0) : 0, served: 0 };
}

function reconcileItems(saved) {
  const arr = (Array.isArray(saved) ? saved : []).map(normalizeLine);
  const byName = {};
  arr.forEach(it => { if (!it.custom && !it.combo) byName[it.name] = it; });
  const merged = buildItems().map(f => {
    const o = byName[f.name];
    return o ? { ...f, qty:o.qty||0, sent:o.sent||0, done:o.done||0, served:o.served||0, firedAt:o.firedAt } : f;
  });
  const extras = arr.filter(it => it.custom || it.combo);   // user-added & configured combos kept as-is
  return [...merged, ...extras];
}

// Overlay the chef-owned `done` count onto the table a waiter is editing (matched by id),
// so a dish turning ready shows live without yanking the waiter's qty / sent / served.
function mergeKitchen(local, server) {
  const byId = {};
  (server.items || []).forEach(it => { byId[it.id] = it; });
  return { ...local, items: (local.items || []).map(it => {
    const s = byId[it.id];
    return s ? { ...it, done: (s.done != null ? s.done : it.done), firedAt: it.firedAt || s.firedAt } : it;
  }) };
}

const STORE_KEY = "levyam_pos_v1";

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (d && Array.isArray(d.tables) && Array.isArray(d.closed))
      return { tables: d.tables.map(t => ({ ...t, items: reconcileItems(t.items) })), closed: d.closed };
  } catch (e) {}
  return { tables: [], closed: [] };
}

function saveData(d) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) {}
}

// app table  <->  pos_tables row
function tableToRow(t) {
  return {
    id: t.id, num: t.num, name: t.name || null,
    guests_adults: t.guests.a, guests_children: t.guests.c,
    pricing_mode: t.useOH ? "open_house" : "a_la_carte",
    opened_at: new Date(t.openedAt).toISOString(),
    items: t.items,
    updated_at: new Date().toISOString(),
  };
}
function rowToTable(r) {
  return {
    id: r.id, num: r.num, name: r.name || "",
    items: reconcileItems(r.items),
    guests: { a: r.guests_adults || 0, c: r.guests_children || 0 },
    useOH: r.pricing_mode !== "a_la_carte",
    openedAt: r.opened_at ? Date.parse(r.opened_at) : Date.now(),
  };
}
// pos_bills row  ->  closed record used by the UI
function billToClosed(r) {
  return {
    id: r.id, num: r.table_num, name: r.name || "",
    items: Array.isArray(r.items) ? r.items : [],
    guests: { a: r.guests_adults || 0, c: r.guests_children || 0 },
    useOH: r.pricing_mode !== "a_la_carte",
    openedAt: r.opened_at ? Date.parse(r.opened_at) : Date.now(),
    paidAt: r.paid_at ? Date.parse(r.paid_at) : Date.now(),
    cash: Number(r.cash_paid) || 0,
    card: Number(r.card_paid) || 0,
    discount: Number(r.discount) || 0,
    tip: Number(r.tip) || 0,
    total: Number(r.grand_total) || 0,
  };
}

async function fetchAll() {
  const [tg, bg] = await Promise.all([
    sb.from("pos_tables").select("*"),
    sb.from("pos_bills").select("*").is("archived_at", null)
      .order("paid_at", { ascending: false }).limit(300),
  ]);
  if (tg.error) throw tg.error;
  if (bg.error) throw bg.error;
  return {
    tables: (tg.data || []).map(rowToTable),
    closed: (bg.data || []).map(billToClosed),
  };
}

function jerusalemDate(d) {                 // "YYYY-MM-DD" for the venue's calendar day
  const x = d ? new Date(d) : new Date();
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Jerusalem" }).format(x);
}

  if (error) throw error;
  return data;                              // { date, summary{}, food, labor, items[], expenses[] }
}
async function addExpense(date, kind, amount, note) {
  return sb.from("pos_expenses").insert({
    business_date: date, kind, amount, note: note || null, created_by: ROLE,
  });
}
async function deleteExpense(id) {

}

// Multi-day analysis: fetch each day's report (parallel) and merge into one shape.
function addDay(s) { const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); }
function shiftDate(ymd, n) { const [y, m, d] = ymd.split("-").map(Number); const dt = new Date(Date.UTC(y, m - 1, d)); dt.setUTCDate(dt.getUTCDate() + n); return dt.toISOString().slice(0, 10); }
function dateRange(from, to) { const out = []; let c = from; for (let i = 0; i < 92 && c <= to; i++) { out.push(c); c = addDay(c); } return out; }
async function fetchRangeReport(from, to) {
  const reps = await Promise.all(dateRange(from, to).map(d => fetchDayReport(d)));
  const sum = { bills:0, covers:0, revenue:0, cash:0, card:0, tips:0, discounts:0 };
  let food = 0, labor = 0; const itemMap = {};
  reps.forEach(r => {
    const s = r.summary || {};
    for (const k in sum) sum[k] += Number(s[k]) || 0;
    food  += Number(r.food)  || 0;
    labor += Number(r.labor) || 0;
    (r.items || []).forEach(it => {
      const m = itemMap[it.name] || (itemMap[it.name] = { name:it.name, category:it.category, units:0, value:0 });
      m.units += Number(it.units) || 0; m.value += Number(it.value) || 0;
    });
  });
  return { summary: sum, food, labor, items: Object.values(itemMap).sort((a,b) => b.units - a.units),
           expenses: [], days: reps.length };
}

// Build the analytics-rich payload that pos_close_table(p_bill, p_items) expects.
function buildBillPayload(t, payment) {
  const tt = tableTotals(t);
  const ordered = t.items.filter(it => it.qty > 0);
  return {
    bill: {
      id: t.id, table_num: t.num, name: t.name || null, status: "paid",
      guests_adults: t.guests.a, guests_children: t.guests.c,
      pricing_mode: t.useOH ? "open_house" : "a_la_carte",
      opened_at: new Date(t.openedAt).toISOString(),
      paid_at: new Date().toISOString(),
      items_count: tt.itemsCount,
      oh_charge: t.useOH ? tt.ohCharge : 0,
      extras_total: t.useOH ? tt.extras : tt.menuAll,
      menu_value: tt.menuAll,
      discount: payment.discount || 0,            // taken off the gross bill
      tip: payment.tip || 0,                       // overpayment kept as tip
      grand_total: payment.total,                  // net charged (gross − discount)
      cash_paid: payment.cash, card_paid: payment.card,
      items: ordered,
    },
    items: ordered.map(it => ({
      item_name: it.name, category: it.cat || null,
      is_open_house: !!it.oh, is_custom: !!it.custom,
      unit_price: it.price, qty: it.qty,
    })),
  };
}

// ── Table helpers ─────────────────────────────────────────────
function tableTotals(t) {
  const extras     = t.items.filter(it => !it.oh).reduce((s,it) => s+it.qty*it.price, 0);
  const menuAll    = t.items.reduce((s,it) => s+it.qty*it.price, 0);
  const headcount  = t.guests.a + t.guests.c;
  const ohByAge    = t.guests.a*OH.adult + t.guests.c*OH.child;
  const ohCharge   = headcount > 4 ? headcount*OH.family : ohByAge;
  const grand      = t.useOH ? ohCharge + extras : menuAll;
  const itemsCount = t.items.reduce((s,it) => s+it.qty, 0);
  return { extras, menuAll, headcount, ohByAge, ohCharge, grand, itemsCount };
}

function nextTableNum(tables) {
  const used = {};
  tables.forEach(t => { used[t.num] = true; });
  let n = 1;
  while (used[n]) n++;
  return n;
}

function makeTable(tables) {
  return {
    id: "t-" + Date.now(),
    num: nextTableNum(tables),
    name: "",
    items: buildItems(),
    guests: { a: 2, c: 0 },
    useOH: false,   // new tables default to "לפי תפריט" (a-la-carte)
    openedAt: Date.now(),
  };
}

const todayStr = () => new Date().toDateString();

function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

// ── ComboPicker ───────────────────────────────────────────────
// Lets staff build a combo (e.g. עסקית דג) from its component slots, so the
// chosen parts travel with the line item — clear for the bill and the chef view.
function ComboPicker({ def, onCancel, onConfirm }) {
  const slots    = def.combo.slots || [];
  const includes = def.combo.includes || [];
  const [sel, setSel] = useState(() => {        // choice slot → option index; count slot → number
    const init = {};
    slots.forEach((s,i) => { if (s.count) init[i] = s.min || 0; });
    return init;
  });
  const [otherText, setOtherText] = useState({});  // "אחר" free-text per slot

  const pickOption = (i, oi)   => setSel(prev => ({ ...prev, [i]: oi }));
  const setCount   = (i, v, s) => setSel(prev => ({ ...prev, [i]: Math.max(s.min || 0, Math.min(s.max, v)) }));

  const choiceSlots = slots.map((s,i) => ({ s, i })).filter(x => !x.s.count);
  const valid = choiceSlots.every(({ s, i }) => {
    const oi = sel[i];
    if (oi == null) return false;
    const opt = s.options[oi];
    return !(opt && opt.other && !(otherText[i] || "").trim());
  });

  const build = () => {
    if (!valid) return;
    const components = [];
    includes.forEach(c => components.push({ name:c.name, nameAr:c.nameAr }));
    slots.forEach((s,i) => {
      if (s.count) {
        const n = sel[i] || 0;
        if (n > 0) components.push({ slot:s.name, slotAr:s.nameAr, name:s.unit, nameAr:s.unitAr, qty:n });
        return;
      }
      const opt = s.options[sel[i]];
      if (!opt) return;
      const txt = (otherText[i] || "").trim();
      components.push({
        slot:s.name, slotAr:s.nameAr,
        name:   opt.other ? opt.name + " · " + txt : opt.name,
        nameAr: opt.other ? opt.nameAr + " · " + txt : opt.nameAr,
      });
    });
    onConfirm(components);
  };

  return h("div", {style:S.overlay, onClick:onCancel},
    h("div", {style:S.receipt, onClick:e => e.stopPropagation()},

      h("div", {style:S.payHead},
        h("div", {style:S.payTotalLbl}, tr("בחירת מרכיבים","اختيار المكوّنات")),
        h("div", {style:S.payTotalBig}, tr(def.name, def.nameAr)),
        h("div", {style:S.payHeadNote}, def.price + " ₪")
      ),

      h("div", {style:S.comboBody},
        includes.length > 0 && h("div", {style:S.comboIncludes},
          tr("כולל","يشمل") + ": " + includes.map(c => nm(c)).join(" · ")
        ),
        slots.map((s,i) =>
          h("div", {key:i, style:S.comboSlot},
            h("div", {style:S.comboSlotLbl},
              tr(s.name, s.nameAr),
              s.count && h("span", {style:S.comboSlotHint}, " (" + (s.min || 0) + "–" + s.max + ")")
            ),
            s.count
              ? h("div", {style:S.comboStepper},
                  h("button", {className:"tap", style:{...S.qBtn, opacity:(sel[i]||0) <= (s.min||0) ? 0.35 : 1},
                    onClick:() => setCount(i, (sel[i]||0) - 1, s)}, "–"),
                  h("span", {style:S.qNum}, sel[i] || 0),
                  h("button", {className:"tap", style:{...S.qBtn, background:SEA, color:"#fff", borderColor:"transparent"},
                    onClick:() => setCount(i, (sel[i]||0) + 1, s)}, "+")
                )
              : h(React.Fragment, null,
                  h("div", {style:S.comboOpts},
                    s.options.map((opt,oi) =>
                      h("button", {key:oi, className:"tap",
                        style:{...S.comboChip, ...(sel[i] === oi ? S.payChipOn : {})},
                        onClick:() => pickOption(i, oi)}, nm(opt))
                    )
                  ),
                  sel[i] != null && s.options[sel[i]] && s.options[sel[i]].other &&
                    h("input", {style:S.comboOther, placeholder:tr("פרטו את הסלט","حدد السلطة"),
                      value:otherText[i] || "", autoFocus:true,
                      onChange:e => setOtherText(p => ({ ...p, [i]: e.target.value }))})
                )
          )
        )
      ),

      h("div", {style:S.payBtns},
        h("button", {className:"tap", style:S.receiptClose, onClick:onCancel}, tr("ביטול","إلغاء")),
        h("button", {className:"tap",
          style:{...S.payConfirm, background: valid ? "#3a9e6e" : "#cfc6b6", color:"#fff", cursor: valid ? "pointer" : "not-allowed"},
          disabled:!valid, onClick:build},
          tr("הוספה לשולחן","إضافة للطاولة"))
      )
    )
  );
}

// Kitchen-status badge for an order line (waiter-facing): in-kitchen / ready.
function statusChip(it) {
  const cooking = (it.sent || 0) - (it.done || 0);
  const ready   = (it.done || 0) - (it.served || 0);
  if (ready > 0)   return h("span", {style:S.stReady}, tr("מוכן","جاهز") + " ×" + ready);
  if (cooking > 0) return h("span", {style:S.stFired}, tr("במטבח","في المطبخ") + " ×" + cooking);
  return null;
}

  const guests = table.guests;
  const useOH  = table.useOH;

  const setGuests = fn => onUpdate(t => ({...t, guests: fn(t.guests)}));
  const setUseOH  = v  => onUpdate(t => ({...t, useOH: v}));

  const setQty = (id, d) =>
    setItems(prev => prev.map(it => it.id===id ? {...it, qty:Math.max(0, it.qty+d)} : it));

    setItems(prev => [...prev, {id:"custom-"+Date.now(), name:draft.name.trim(), price, oh:draft.oh, cat:"פריטים שהוספתי", qty:1, custom:true}]);
    setDraft({name:defName(), price:"", oh:false});
    setAdding(false);
  };

  const removeItem = id => setItems(prev => prev.filter(it => it.id !== id));

  const addCombo = (def, components) => {
    setItems(prev => [...prev, {
      id:"combo-"+Date.now(), name:def.name, nameAr:def.nameAr, price:def.price,
      oh:def.oh, cat:def.cat, catAr:def.catAr, qty:1, combo:true, components,
    }]);
    setComboPick(null);

  const tableLabel = (table.name ? table.name + " · " : "") + tr("שולחן","طاولة") + " " + table.num;

  const unsent      = items.reduce((s, it) => s + Math.max(0, (it.qty || 0) - (it.sent || 0)), 0);   // portions not yet sent

        h("button", {className:"tap", style:S.cancelTableBtn,
          onClick:() => { if (window.confirm(tr("לבטל ולמחוק את השולחן? ההזמנה לא תישמר.","إلغاء وحذف الطاولة؟ لن يتم حفظ الطلب."))) onCancelTable(); }}, "✕")

// ── TotalCell ─────────────────────────────────────────────────
function TotalCell({ label, val, color, cur }) {
  const unit = cur === undefined ? "₪" : cur;   // pass cur:"" for a plain count (e.g. people)
  return h("div", {style:S.totalCell},
    h("span", {style:{...S.totalCellNum, color}}, val, unit && h("span", {style:S.totalCellCur}, " " + unit)),
    h("span", {style:S.totalCellLbl}, label)
  );
}

// ── PaymentModal ──────────────────────────────────────────────
function PaymentModal({ total, tableLabel, onCancel, onConfirm }) {
  const [cash, setCash]     = useState("");
  const [card, setCard]     = useState("");
  const [tipPct, setTipPct] = useState(0);           // tip-calculator selection
  const cashN = parseInt(cash, 10) || 0;
  const cardN = parseInt(card, 10) || 0;
  const paid  = cashN + cardN;
  const sugg    = Math.round(total * tipPct / 100);  // suggested tip from the calculator
  const collect = total + sugg;                       // bill + suggested tip (quick-fill target)
  const tipN      = Math.max(0, paid - total);        // overpayment becomes the tip
  const shortfall = Math.max(0, total - paid);        // underpayment → hidden discount (asked on close)
  const fullyPaid = total > 0 && paid >= total;
  const ok = total > 0 && paid > 0;

  const msg = total === 0 ? tr("אין פריטים בחשבון","لا أصناف في الحساب")
    : paid === 0          ? tr("הזינו סכום שהתקבל","أدخل المبلغ المستلم")
    : shortfall > 0       ? tr("חסר","ناقص") + " " + shortfall + " ₪ · " + tr("הנחה?","خصم؟")
    : tipN > 0            ? tr("טיפ","بقشيش") + ": " + tipN + " ₪ ✓"
    :                       tr("מאוזן","متوازن") + " ✓";

  // Underpayment is treated as a (customer-invisible) discount, confirmed before closing.
  const confirm = () => {
    if (!ok) return;
    if (shortfall > 0) {
      const q = tr(
        "התקבל " + paid + " ₪ מתוך " + total + " ₪.\nלהחיל הנחה של " + shortfall + " ₪ ולסגור את השולחן?",
        "تم استلام " + paid + " ₪ من أصل " + total + " ₪.\nتطبيق خصم بقيمة " + shortfall + " ₪ وإغلاق الطاولة؟");
      if (!window.confirm(q)) return;
      onConfirm({ cash:cashN, card:cardN, discount:shortfall, tip:0, total:paid });
    } else {
      onConfirm({ cash:cashN, card:cardN, discount:0, tip:tipN, total });
    }
  };

  return h("div", {style:S.overlay, onClick:onCancel},
    h("div", {style:S.receipt, onClick:e => e.stopPropagation()},

      h("div", {style:S.payHead},
        h("div", {style:S.payTotalLbl}, tr("תשלום","الدفع") + " · " + tableLabel),
        h("div", {style:S.payTotalBig}, total + " ₪"),
        sugg > 0 && h("div", {style:S.payHeadNote},
          "+ " + tr("טיפ","بقشيش") + " " + sugg + " ₪ = " + collect + " ₪")
      ),

      h("div", {style:S.payBody},
        // Tip calculator — staff helper to add a tip on top of the bill
        h("div", {style:S.tipCalcHead}, tr("מחשבון טיפ","حاسبة البقشيش")),
        h("div", {style:S.payQuick},
          [0,10,12,15].map(p =>
            h("button", {key:p, className:"tap",
              style:{...S.payChip, ...(tipPct === p ? S.payChipOn : {})},
              onClick:() => setTipPct(p)},
              p === 0 ? tr("ללא","بدون") : p + "%"))
        ),

        // Split the amount between cash & card (quick-fill = bill + selected tip)
        h("div", {style:S.payQuick},
          h("button", {className:"tap", style:S.payChip, onClick:() => { setCash(String(collect)); setCard(""); }}, tr("הכל מזומן","الكل نقداً")),
          h("button", {className:"tap", style:S.payChip, onClick:() => { setCard(String(collect)); setCash(""); }}, tr("הכל אשראי","الكل بطاقة")),
          h("button", {className:"tap", style:S.payChip, onClick:() => { setCash(""); setCard(""); }}, tr("נקה","مسح"))
        ),
        h("div", {style:S.payField},
          h("span", {style:S.payFieldLbl}, tr("מזומן","نقداً")),
          h("input", {style:S.payInput, type:"number", inputMode:"numeric", placeholder:"0",
            value:cash, onChange:e => setCash(e.target.value)}),
          h("span", {style:S.payCur}, "₪")
        ),
        h("div", {style:S.payField},
          h("span", {style:S.payFieldLbl}, tr("אשראי","بطاقة")),
          h("input", {style:S.payInput, type:"number", inputMode:"numeric", placeholder:"0",
            value:card, onChange:e => setCard(e.target.value)}),
          h("span", {style:S.payCur}, "₪")
        ),
        h("div", {style:{...S.payRemain, ...(fullyPaid ? S.payRemainOk : S.payRemainBad)}}, msg)
      ),

      h("div", {style:S.payBtns},
        h("button", {className:"tap", style:S.receiptClose, onClick:onCancel}, tr("ביטול","إلغاء")),
        h("button", {className:"tap",
          style:{...S.payConfirm, background: ok ? "#3a9e6e" : "#cfc6b6", color:"#fff", cursor: ok ? "pointer" : "not-allowed"},
          disabled:!ok, onClick:confirm},
          tr("אישור וסגירה","تأكيد وإغلاق"))
      )
    )
  );
}

// ── ReportView (date-scoped day report; role-filtered) ────────
// Chef sees operational stats (tables/covers/items) + food-cost entry, no revenue.
// Manager (full) also sees revenue/cash/card/tips/discounts, labor entry, and net profit.
function ReportView({ full, canAddFood, canAddLabor, canManage, closed, onReopen, onClear, onClose }) {
  const today = jerusalemDate();
  const [from, setFrom]   = useState(today);
  const [to, setTo]       = useState(today);
  const [rep, setRep]     = useState(null);
  const [loading, setLoad]= useState(true);
  const [tick, setTick]   = useState(0);
  const [food,  setFood]  = useState({ amount:"", note:"" });
  const [labor, setLabor] = useState({ amount:"", note:"" });
  const [showDetails, setShowDetails] = useState(false);
  const isRange   = from !== to;
  const rangeDays = isRange ? dateRange(from, to).length : 1;

  // Quick date presets (intuitive one-tap ranges) — chef gets day-only, manager gets multi-day too.
  const yest = shiftDate(today, -1);
  const presets = full
    ? [["today", tr("היום","اليوم")], ["yesterday", tr("אתמול","أمس")], ["7", tr("7 ימים","7 أيام")], ["30", tr("30 יום","30 يوماً")]]
    : [["today", tr("היום","اليوم")], ["yesterday", tr("אתמול","أمس")]];
  const applyPreset = k =>
    k === "today"     ? (setFrom(today), setTo(today))
    : k === "yesterday" ? (setFrom(yest), setTo(yest))
    : k === "7"       ? (setFrom(shiftDate(today, -6)),  setTo(today))
    : k === "30"      ? (setFrom(shiftDate(today, -29)), setTo(today)) : null;
  const activePreset =
    (from === today && to === today) ? "today"
    : (from === yest && to === yest) ? "yesterday"
    : (to === today && from === shiftDate(today, -6))  ? "7"
    : (to === today && from === shiftDate(today, -29)) ? "30" : "";

  useEffect(() => {
    let alive = true; setLoad(true);
    (isRange ? fetchRangeReport(from, to) : fetchDayReport(from))
      .then(r => { if (alive) { setRep(r); setLoad(false); } })
      .catch(() => { if (alive) { setRep(null); setLoad(false); } });
    return () => { alive = false; };
  }, [from, to, tick]);

  const s = (rep && rep.summary) || {};
  const isToday = !isRange && from === today;
  const foodTotal  = rep ? Number(rep.food)  || 0 : 0;
  const laborTotal = rep ? Number(rep.labor) || 0 : 0;
  const rev = Number(s.revenue) || 0;
  const net = rev - foodTotal - laborTotal;
  // Derived detail metrics for the manager's expandable breakdown.
  const avgBill   = s.bills  ? Math.round(rev / s.bills)  : (Number(s.avg_bill) || 0);
  const avgCover  = s.covers ? Math.round(rev / s.covers) : 0;
  const tipRate   = rev ? Math.round((Number(s.tips) || 0) / rev * 100) : 0;
  const foodPct   = rev ? Math.round(foodTotal  / rev * 100) : 0;
  const laborPct  = rev ? Math.round(laborTotal / rev * 100) : 0;
  const netMargin = rev ? Math.round(net / rev * 100) : 0;
  const exp = (rep && rep.expenses) || [];
  const foodList  = exp.filter(e => e.kind === "food");
  const laborList = exp.filter(e => e.kind === "labor");
  const itemAr = n => (LANG === "ar" ? (NAME_AR[n] || n) : n);

  const submit = (kind, d, set) => {
    const amt = parseInt(d.amount, 10);
    if (!amt) return;
    addExpense(from, kind, amt, d.note.trim()).then(() => { set({ amount:"", note:"" }); setTick(t => t + 1); });
  };
  const removeExp = id => deleteExpense(id).then(() => setTick(t => t + 1));

  const tCell = (label, val, color, cur) => h(TotalCell, { label, val, color, cur });
  const detail = (label, val) => h("div", {style:S.detailRow},
    h("span", {style:S.detailLbl}, label), h("span", {style:S.detailVal}, val));
  const costForm = (kind, d, set, notePh) => h("div", {style:S.costAddRow},
    h("input", {style:S.costNoteInput, placeholder:notePh, value:d.note,
      onChange:e => set({ ...d, note:e.target.value })}),
    h("input", {style:S.costAmtInput, type:"number", inputMode:"numeric", placeholder:"₪", value:d.amount,
      onChange:e => set({ ...d, amount:e.target.value })}),
    h("button", {className:"tap", style:S.costAdd, onClick:() => submit(kind, d, set)}, tr("הוסף","إضافة"))
  );
  const costRow = (e, canDel) => h("div", {key:e.id, style:S.costRow},
    h("span", {style:S.costNote}, e.note || tr("ללא הערה","بدون ملاحظة")),
    h("span", {style:S.costAmt}, e.amount + " ₪"),
    canDel && h("button", {className:"tap", style:S.costDel, onClick:() => removeExp(e.id)}, "✕")
  );

  const todayClosed = isToday ? closed.filter(c => new Date(c.paidAt).toDateString() === todayStr()) : [];

  return h("div", {style:S.overlay, onClick:onClose},
    h("div", {style:S.receipt, onClick:e => e.stopPropagation()},

      h("div", {style:{...S.receiptHead, background:SEA_DEEP}},
        h("span", {style:S.receiptBrand}, full ? tr("דוח","تقرير") : tr("דוח מטבח","تقرير المطبخ")),
        h("div", {style:S.reportPresets},
          presets.map(([k, lbl]) =>
            h("button", {key:k, className:"tap",
              style:{...S.reportPreset, ...(activePreset === k ? S.reportPresetOn : {})},
              onClick:() => applyPreset(k)}, lbl))
        ),
        h("div", {style:S.reportDates},
          h("input", {type:"date", max:to, value:from, style:S.reportDate,
            onChange:e => { const v = e.target.value; setFrom(v); if (!full || v > to) setTo(v); }}),
          full && h("span", {style:S.reportDash}, "–"),
          full && h("input", {type:"date", max:today, value:to, style:S.reportDate,
            onChange:e => { const v = e.target.value; setTo(v); if (v < from) setFrom(v); }})
        )
      ),

      h("div", {style:S.receiptScroll},
        loading ? h("div", {style:S.receiptEmpty}, h(Bi, {he:"טוען…", ar:"جار التحميل…"}))
        : !rep ? h("div", {style:S.receiptEmpty}, h(Bi, {he:"שגיאה בטעינת הדוח", ar:"خطأ في تحميل التقرير"}))
        : h(React.Fragment, null,

            isRange && h("div", {style:S.reportRangeNote},
              tr("טווח","نطاق") + " · " + rangeDays + " " + tr("ימים","أيام") + " · " + from + " → " + to),

            h("div", {style:S.reportTiles},
              tCell(tr("שולחנות","طاولات"), s.bills || 0, SEA_DEEP, ""),
              tCell(tr("סועדים","ضيوف"),   s.covers || 0, SEA, ""),
              full && tCell(tr("הכנסה","الدخل"),   s.revenue || 0, INK),
              full && tCell(tr("מזומן","نقداً"),   s.cash || 0, "#3a9e6e"),
              full && tCell(tr("אשראי","بطاقة"),   s.card || 0, SEA),
              full && tCell(tr("טיפים","بقشيش"),   s.tips || 0, "#a9791b"),
              full && (s.discounts > 0) && tCell(tr("הנחות","خصومات"), s.discounts || 0, SUN),
              tCell(tr("עלות מזון","تكلفة الطعام"), foodTotal, SUN),
              full && tCell(tr("עלות עובדים","تكلفة العمال"), laborTotal, SUN)
            ),

            full && h("div", {style:S.reportNet},
              h("span", {style:S.reportNetLbl}, tr("רווח נקי","الربح الصافي")),
              h("span", {style:{...S.reportNetNum, color: net >= 0 ? "#2f7d57" : "#c2553f"}}, net + " ₪")
            ),
            full && h("div", {style:S.reportHint}, tr("הכנסה − מזון − עובדים · טיפים לא נכללים","الدخل − الطعام − العمال · البقشيش غير محتسب")),

// ── ChefView (Kitchen Display) ────────────────────────────────
// Fired-but-undone dishes, grouped by table, oldest order first. One big tap = done.
function ChefView({ tables, onMarkDone, onBack, lang, onToggleLang }) {
  const [showDone, setShowDone] = useState(false);

  const tickets = tables.map(t => {
    const cooking = t.items.filter(it => (it.sent || 0) - (it.done || 0) > 0);   // chef's queue
    const ready   = t.items.filter(it => (it.done || 0) > 0);                     // for "show done"
    const firstFire = t.items.reduce((m, it) =>
      ((it.sent || 0) - (it.done || 0) > 0 && it.firedAt) ? Math.min(m, Date.parse(it.firedAt) || Infinity) : m, Infinity);
    return { t, cooking, ready, firstFire };
  }).filter(x => (showDone ? x.ready.length : x.cooking.length) > 0)
    .sort((a, b) => a.firstFire - b.firstFire);

  const pendingCount = tables.reduce((s, t) =>
    s + t.items.reduce((n, it) => n + Math.max(0, (it.sent || 0) - (it.done || 0)), 0), 0);

  return h("div", {style:S.app},
    h("div", {style:S.chefHead},
      h("button", {className:"tap", style:S.chefBack, onClick:onBack}, "→ " + tr("יציאה","خروج")),
      h("span", {style:S.chefTitle}, tr("מטבח","المطبخ") + (pendingCount ? " · " + pendingCount : "")),
      h(LangToggle, {lang, onToggle:onToggleLang})
    ),
    h("div", {style:S.chefToolbar},
      h("button", {className:"tap", style:{...S.chefToggle, ...(showDone ? S.chefToggleOn : {})}, onClick:() => setShowDone(v => !v)},
        showDone ? tr("הסתר שהושלמו","إخفاء المنجزة") : tr("הצג שהושלמו","عرض المنجزة"))
    ),
    h("div", {style:S.scroll},
      tickets.length === 0
        ? h("div", {style:S.chefEmpty}, h(Bi, {he:"אין הזמנות פתוחות במטבח", ar:"لا طلبات مفتوحة في المطبخ"}))
        : tickets.map(({ t, cooking, ready, firstFire }) => {
            const list = showDone ? ready : cooking;
            return h("div", {key:t.id, style:S.chefCard},
              h("div", {style:S.chefCardHead},
                h("span", {style:S.chefTableNum}, t.num),
                h("div", {style:S.chefCardInfo},
                  h("div", {style:S.chefTableName}, (t.name ? t.name + " · " : "") + tr("שולחן","طاولة") + " " + t.num),
                  isFinite(firstFire) && h("div", {style:S.chefTableSub}, tr("נשלח","أُرسل") + " " + fmtTime(firstFire))
                ),
                cooking.length > 0 && h("span", {style:S.chefCount}, cooking.length)
              ),
              list.map(it => {
                const showN = showDone ? (it.done || 0) : ((it.sent || 0) - (it.done || 0));
                return h("div", {key:it.id, style:{...S.chefDish, ...(showDone ? S.chefDishDone : {})}},
                  h("div", {style:S.chefDishMain},
                    h("span", {style:S.chefDishQty}, "×" + showN),
                    h("div", {style:S.chefDishText},
                      h("span", {style:S.chefDishName}, nm(it)),
                      it.combo && it.components && it.components.length > 0 &&
                        h("div", {style:S.chefDishParts}, it.components.map(c => nm(c) + (c.qty ? " ×" + c.qty : "")).join(" · "))
                    )
                  ),
                  showDone
                    ? h("button", {className:"tap", style:S.chefUndo, onClick:() => onMarkDone(t.id, it.id, false)}, tr("בטל","تراجع"))
                    : h("button", {className:"tap", style:S.chefDone, onClick:() => onMarkDone(t.id, it.id, true)}, tr("מוכן","تم") + " ✓")
                );
              })
            );
          })
    )
  );
}

// ── RoleModal (switch this device's role; chef/manager are code-gated) ──
function RoleModal({ current, onPick, onClose }) {
  const [pending, setPending] = useState(null);   // role awaiting its code
  const [val, setVal] = useState("");
  const [err, setErr] = useState(false);
  const roles = ["waiter", "chef", "manager"];

  const choose = (r) => {
    if (r === current) { onClose(); return; }
    if (!ROLE_CODES[r]) { onPick(r); return; }      // waiter needs no code
    setPending(r); setVal(""); setErr(false);
  };
  const submit = () => {
    if (val === ROLE_CODES[pending]) onPick(pending);
    else { setErr(true); setVal(""); }
  };

  return h("div", {style:S.overlayC, onClick:onClose},
    h("div", {style:S.pwdBox, onClick:e => e.stopPropagation()},
      h("div", {style:S.pwdTitle}, tr("תפקיד במכשיר","دور الجهاز")),
      pending
        ? h(React.Fragment, null,
            h("div", {style:S.pwdSub}, tr("קוד עבור","رمز لـ") + " " + tr(ROLE_LABELS[pending].he, ROLE_LABELS[pending].ar)),
            h("input", {style:S.pwdInput, type:"password", inputMode:"numeric", autoFocus:true, placeholder:"••••",
              value:val, onChange:e => { setVal(e.target.value); setErr(false); }, onKeyDown:e => { if (e.key === "Enter") submit(); }}),
            h("div", {style:S.pwdErr}, err ? tr("קוד שגוי","رمز خاطئ") : ""),
            h("div", {style:S.pwdBtns},
              h("button", {className:"tap", style:S.pwdCancel, onClick:() => setPending(null)}, tr("חזור","رجوع")),
              h("button", {className:"tap", style:S.pwdConfirm, onClick:submit}, tr("אישור","تأكيد"))
            )
          )
        : h(React.Fragment, null,
            h("div", {style:S.pwdSub}, tr("נשמר במכשיר זה","يُحفظ على هذا الجهاز")),
            h("div", {style:S.roleList},
              roles.map(r =>
                h("button", {key:r, className:"tap", style:{...S.roleBtn, ...(r === current ? S.roleBtnOn : {})}, onClick:() => choose(r)},
                  h("span", {style:S.roleBtnLbl}, tr(ROLE_LABELS[r].he, ROLE_LABELS[r].ar)),
                  r === current ? h("span", {style:S.roleBtnTag}, "✓")
                    : ROLE_CODES[r] ? h("span", {style:S.roleBtnTag}, "🔒") : null
                )
              )
            ),
            h("button", {className:"tap", style:{...S.pwdCancel, width:"100%"}, onClick:onClose}, tr("סגור","إغلاق"))
          )
    )
  );
}

// ── App ───────────────────────────────────────────────────────
// ── Live shared data (Supabase realtime + localStorage cache) ──
function usePosData(activeId) {
  const [data, setData]     = useState(loadData);    // paint from cache instantly
  const [online, setOnline] = useState(true);
  const dataRef   = useRef(data);     dataRef.current = data;
  const activeRef = useRef(activeId);  activeRef.current = activeId;
  const pushers   = useRef({});
  const dirty     = useRef(new Set());

  useEffect(() => { saveData(data); }, [data]);       // keep cache fresh

  // initial load + realtime subscription
  useEffect(() => {
    let alive = true, timer = null;
    const reload = async () => {
      try {
        const fresh = await fetchAll();
        if (!alive) return;
        setOnline(true);
        setData(prev => {
          const id = activeRef.current;
          const localActive = id ? prev.tables.find(t => t.id === id) : null;
          if (!localActive) return fresh;             // not editing — take server truth
          const serverActive = fresh.tables.find(t => t.id === id);
          // keep the waiter's in-progress items, but overlay the chef's kitchen flags
          const mergedActive = serverActive ? mergeKitchen(localActive, serverActive) : localActive;
          const tables = serverActive ? fresh.tables.map(t => t.id === id ? mergedActive : t)
                                      : [...fresh.tables, mergedActive];
          return { tables, closed: fresh.closed };    // never yank the table being edited
        });
      } catch (e) { if (alive) setOnline(false); }
    };
    const flushDirty = async () => {
      for (const id of [...dirty.current]) {
        const t = dataRef.current.tables.find(x => x.id === id);
        try { if (t) await sb.from("pos_tables").upsert(tableToRow(t)); dirty.current.delete(id); } catch (e) {}
      }
    };
    const resync = async () => { await flushDirty(); reload(); };
    const ping = () => { clearTimeout(timer); timer = setTimeout(reload, 250); };

    reload();
    const ch = sb.channel("pos-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "pos_tables" }, ping)
      .on("postgres_changes", { event: "*", schema: "public", table: "pos_bills"  }, ping)
      .subscribe(st => { if (st === "SUBSCRIBED") resync(); });
    window.addEventListener("online", resync);
    return () => { alive = false; clearTimeout(timer); sb.removeChannel(ch); window.removeEventListener("online", resync); };
  }, []);

  const pushTable = (t, immediate) => {
    const run = () => sb.from("pos_tables").upsert(tableToRow(t)).then(({ error }) => {
      if (error) { dirty.current.add(t.id); setOnline(false); }
      else { dirty.current.delete(t.id); setOnline(true); }
    });
    if (immediate) { run(); return; }
    clearTimeout(pushers.current[t.id]);
    pushers.current[t.id] = setTimeout(run, 500);     // batch rapid qty taps
  };

  const openNew = () => {
    const t = makeTable(dataRef.current.tables);
    setData(d => ({ ...d, tables: [...d.tables, t] }));
    pushTable(t, true);
    return t.id;
  };

  const updateTable = (id, updater) => {
    const cur = dataRef.current.tables.find(t => t.id === id);
    if (!cur) return;
    const next = updater(cur);
    setData(d => ({ ...d, tables: d.tables.map(t => t.id === id ? next : t) }));
    pushTable(next, false);
  };

  const payAndClose = (id, payment) => {
    const t = dataRef.current.tables.find(x => x.id === id);
    if (!t) return;
    clearTimeout(pushers.current[id]);
    const { bill, items } = buildBillPayload(t, payment);
    const rec = { id: t.id, num: t.num, name: t.name || "", items: t.items, guests: t.guests,
                  useOH: t.useOH, openedAt: t.openedAt, paidAt: Date.now(),
                  cash: payment.cash, card: payment.card,
                  discount: payment.discount || 0, tip: payment.tip || 0, total: payment.total };
    setData(d => ({ ...d, tables: d.tables.filter(x => x.id !== id), closed: [rec, ...d.closed] }));
    sb.rpc("pos_close_table", { p_bill: bill, p_items: items }).then(({ error }) => {
      setOnline(!error);
      if (error) { console.error(error); alert(tr("שמירת החשבון נכשלה — בדקו חיבור ונסו שוב","فشل حفظ الحساب — تحقق من الاتصال وحاول مجدداً")); }
    });
  };

  const cancelTable = (id) => {
    clearTimeout(pushers.current[id]); dirty.current.delete(id);
    setData(d => ({ ...d, tables: d.tables.filter(x => x.id !== id) }));
    sb.from("pos_tables").delete().eq("id", id).then(({ error }) => setOnline(!error));
  };

  const reopen = (id) => {
    const rec = dataRef.current.closed.find(x => x.id === id);
    if (!rec) return;
    const num = nextTableNum(dataRef.current.tables);
    const t = { id: rec.id, num, name: rec.name, items: reconcileItems(rec.items), guests: rec.guests,
                useOH: rec.useOH, openedAt: rec.openedAt || Date.now() };
    setData(d => ({ ...d, closed: d.closed.filter(x => x.id !== id), tables: [...d.tables, t] }));
    sb.rpc("pos_reopen_bill", { p_id: id, p_num: num }).then(({ error }) => setOnline(!error));
  };

  // Waiter "send to kitchen": send the delta (sent = qty) on any line with more ordered
  // than already sent — this is what makes re-ordering more of an item reach the kitchen.
  const fireTable = (id) => {
    const cur = dataRef.current.tables.find(t => t.id === id);
    if (!cur) return;
    const now = new Date().toISOString();
    const next = { ...cur, items: cur.items.map(it =>
      ((it.qty || 0) > (it.sent || 0)) ? { ...it, sent: it.qty, firedAt: it.firedAt || now } : it) };
    setData(d => ({ ...d, tables: d.tables.map(t => t.id === id ? next : t) }));
    pushTable(next, true);
  };

  // Chef "mark ready / undo": done = sent (ready) or done = served (undo). Atomic per-item
  // RPC reads sent/served on the server, so it never clobbers a waiter editing the table.
  const markDone = (tableId, itemId, ready) => {
    setData(d => ({ ...d, tables: d.tables.map(t => t.id !== tableId ? t
      : { ...t, items: t.items.map(it => it.id === itemId
          ? { ...it, done: ready ? (it.sent || 0) : (it.served || 0) } : it) }) }));
    sb.rpc("pos_mark_item", { p_id: tableId, p_item_id: itemId, p_ready: !!ready })
      .then(({ error }) => setOnline(!error));
  };

  // Waiter opens a table → its ready dishes are acknowledged as served (served = done),
  // clearing them from the "ready to serve" signal.
  const serveReady = (id) => {
    const cur = dataRef.current.tables.find(t => t.id === id);
    if (!cur || !cur.items.some(it => (it.done || 0) > (it.served || 0))) return;
    const next = { ...cur, items: cur.items.map(it =>
      (it.done || 0) > (it.served || 0) ? { ...it, served: it.done } : it) };
    setData(d => ({ ...d, tables: d.tables.map(t => t.id === id ? next : t) }));
    pushTable(next, true);
  };

  // "End day" archives (hides) today's bills — data is kept for analytics, never deleted.
  const clearToday = () => {
    const today = todayStr();
    const ids = dataRef.current.closed.filter(c => new Date(c.paidAt).toDateString() === today).map(c => c.id);
    setData(d => ({ ...d, closed: d.closed.filter(c => new Date(c.paidAt).toDateString() !== today) }));
    if (ids.length) sb.from("pos_bills").update({ archived_at: new Date().toISOString() }).in("id", ids)
      .then(({ error }) => setOnline(!error));
  };

  return { data, online, openNew, updateTable, payAndClose, cancelTable, reopen, clearToday, fireTable, markDone, serveReady };
}

// ── App (root component) ──────────────────────────────────────
function App() {
  const [lang, setLang]               = useState(loadLang);
  const [activeId, setActiveId]       = useState(null);
  const [showReport, setShowReport]   = useState(false);
  const [appUnlocked, setAppUnlocked] = useState(() => {
    try { return localStorage.getItem(APP_OK_KEY) === "1"; } catch (e) { return false; }
  });
  const [role, setRole]               = useState(loadRole);
  const [showRole, setShowRole]       = useState(false);
  const [chefMode, setChefMode]       = useState(false);

  const pos  = usePosData(activeId);
  const data = pos.data;

  LANG = lang;
  ROLE = role;

  useEffect(() => { saveLang(lang); }, [lang]);
  useEffect(() => { saveRole(role); }, [role]);

  const toggleLang  = () => setLang(l => l === "he" ? "ar" : "he");
  const openNew     = () => { setActiveId(pos.openNew()); };
  const updateTable = pos.updateTable;
  const payAndClose = (id, payment) => { pos.payAndClose(id, payment); setActiveId(null); };
  const cancelTable = (id) => { pos.cancelTable(id); setActiveId(null); };
  const reopen      = (id) => { pos.reopen(id); setShowReport(false); };
  const clearToday  = pos.clearToday;
  const reportsUnlocked = can("pos.reports");   // managers see the full day summary; others get the ops report or none

  if (!appUnlocked) return h(AppGate, { onUnlock: () => {
    try { localStorage.setItem(APP_OK_KEY, "1"); } catch (e) {}
    setAppUnlocked(true);
  } });

  if (chefMode && can("pos.kitchen")) return h(ChefView, {
    tables: data.tables,
    onMarkDone: pos.markDone,
    onBack: () => setChefMode(false),
    lang, onToggleLang: toggleLang,
  });

  const active = data.tables.find(t => t.id === activeId);

  if (active) return h(TableView, {
    table: active,
    onUpdate: (updater) => updateTable(active.id, updater),
    onBack: () => setActiveId(null),
    onPaid: (payment) => payAndClose(active.id, payment),
    onCancelTable: () => cancelTable(active.id),
    onFire: () => pos.fireTable(active.id),
    lang, onToggleLang: toggleLang,
  });

  return h(React.Fragment, null,
    !pos.online && h("div", {style:{position:"fixed",top:0,left:0,right:0,background:"#c2553f",color:"#fff",textAlign:"center",padding:"6px 8px",fontSize:13,fontWeight:600,zIndex:9999}},
      tr("אין חיבור — הנתונים יסונכרנו כשהחיבור יחזור","لا يوجد اتصال — ستتم المزامنة عند عودته")),
    h(HomeView, {
      tables: data.tables,
      closed: data.closed,
      onOpen: (id) => { pos.serveReady(id); setActiveId(id); },
      onNew: openNew,
      onReport: () => setShowReport(true),   // only rendered for chef/manager cards
      lang, onToggleLang: toggleLang,
      unlocked: reportsUnlocked,
      role, onSwitchRole: () => setShowRole(true), onChef: () => setChefMode(true),
    }),
    showReport && h(ReportView, {
      full: reportsUnlocked,
      canAddFood: can("pos.costs_food"),
      canAddLabor: can("pos.costs_labor"),
      canManage: can("pos.manage"),
      closed: data.closed,
      onReopen: reopen,
      onClear: clearToday,
      onClose: () => setShowReport(false),
    }),
    showRole && h(RoleModal, {
      current: role,
      onPick: (r) => { setRole(r); setShowRole(false); if (r === "waiter") setChefMode(false); },
      onClose: () => setShowRole(false),
    })
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(App, null));

})();
</script>
</body>
</html>
